spring.application.name=kirana-backend
server.port=8080

# MySQL (database is auto-created if missing). Change username/password for your machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kirana_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1208}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
